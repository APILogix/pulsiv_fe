<!doctype html>
<html lang="en" data-theme="mono" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Sentinel — Enterprise AI-powered API observability and telemetry platform. Real-time metrics, tracing, distributed error tracking, and automated incident response." />
    <link rel="canonical" href="https://pulsiv.io/" />
    <meta property="og:title" content="Sentinel — AI-powered API observability" />
    <meta property="og:description" content="Sentinel — Enterprise AI-powered API observability and telemetry platform. Real-time metrics, tracing, distributed error tracking, and automated incident response." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Sentinel — AI-powered API observability</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <!--
      Anti-FOUC theme boot (mono theme locked).
    -->
    <script>
      (function () {
        try {
          localStorage.setItem('sentinel-theme', 'mono');
          document.documentElement.setAttribute('data-theme', 'mono');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'mono');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
