<!doctype html>
<html lang="en" class="dark" data-theme="mono" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090A" />
    <title>Monitra — Quiet Control Room for Modern APIs</title>
    <!--
      Anti-FOUC theme boot (mono-first dark mode locked).
    -->
    <script>
      (function () {
        try {
          localStorage.setItem('monitra-theme', 'mono');
          localStorage.setItem('sentinel-theme', 'mono');
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'mono');
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'mono');
        }
      })();
    </script>
  </head>
  <body class="bg-[#08090A] text-[#F4F5F7] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
